<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Разбор партий</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='56'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--dim:#a3a7c0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;color:#f5f6fc;background:#070614;color-scheme:dark;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(45% 35% at 15% 10%,rgba(124,58,237,.6),transparent 70%),radial-gradient(40% 30% at 90% 35%,rgba(236,72,153,.38),transparent 70%),radial-gradient(55% 40% at 55% 100%,rgba(37,99,235,.55),transparent 70%)}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:12px}
.v{display:grid;gap:12px}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}
.me{--c:48,209,88}.op{--c:255,69,58}
.dim,small{color:var(--dim)}
h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
.g{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.14);border-radius:22px;box-shadow:inset 0 1.5px 1px rgba(255,255,255,.38),inset 0 -1px 1px rgba(255,255,255,.07),0 12px 32px rgba(0,0,0,.35)}
.pad{padding:14px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px}
.logo{font-size:22px;font-weight:800;letter-spacing:-.03em;background:linear-gradient(180deg,#fff,#9ca1bb 60%,#e8eaf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:flex;gap:4px;padding:3px;border-radius:99px;background:rgba(0,0,0,.3)}
.seg button{border:0;border-radius:99px;padding:6px 12px;background:transparent;font-size:13px;font-weight:600}
.seg .on{background:rgba(255,255,255,.2);box-shadow:inset 0 1px 1px rgba(255,255,255,.4)}
.btn{border:1px solid rgba(255,255,255,.22);background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.07));border-radius:99px;padding:10px 18px;font-weight:600;box-shadow:inset 0 1px 1px rgba(255,255,255,.45),0 4px 14px rgba(0,0,0,.3)}
.btn:active{transform:scale(.97)}
.btn.sm{padding:6px 14px}
input,textarea{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.3);border-radius:14px;padding:12px;margin-bottom:10px}
summary{font-weight:600;cursor:pointer;margin-bottom:10px}
#msg{margin:0;text-align:center}
.gm{display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;width:100%;border-radius:18px}
.rd{width:10px;height:10px;border-radius:50%;flex:none}
.row{display:flex;align-items:center;justify-content:space-between}
#pg{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#38bdf8);transition:width .2s}
.pl{display:flex;align-items:baseline;gap:8px;padding:9px 14px;border-radius:16px;background:linear-gradient(rgba(var(--c),.3),rgba(var(--c),.12));border:1px solid rgba(var(--c),.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);cursor:pointer}
.pl span{margin-left:auto;font-size:12px;font-weight:700;color:rgb(var(--c))}
.bw{display:flex;gap:8px}
#bar{width:14px;flex:none;border-radius:9px;background:#1b1c2c;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.2)}
#bar i{position:absolute;inset:auto 0 0;background:#f5f6fc;height:50%;transition:height .35s}
#bd{flex:1;min-width:0;aspect-ratio:1;display:grid;grid:repeat(8,1fr)/repeat(8,1fr);position:relative;border-radius:16px;overflow:hidden;container-type:inline-size;border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.s{position:relative;display:grid;place-items:center}
.s.l{background:#cfd3ec}.s.d{background:#6b70a8}
.s.h::after{content:"";position:absolute;inset:0;background:rgb(var(--c));opacity:.55}
.s u{text-decoration:none;font-size:10.4cqw;line-height:1;position:relative;z-index:1}
u.w{color:#fff;text-shadow:0 0 1px #000,0 0 3px rgba(0,0,0,.9)}
u.b{color:#14152a;text-shadow:0 0 1px #fff,0 0 3px rgba(255,255,255,.55)}
.s s{position:absolute;left:3%;top:0;font-size:2.6cqw;font-weight:700;opacity:.7;text-decoration:none;color:#1a1b30}
.s[data-f]::before{content:attr(data-f);position:absolute;right:4%;bottom:0;font-size:2.6cqw;font-weight:700;opacity:.7;color:#1a1b30}
.bg{position:absolute;top:2%;right:2%;width:44%;height:44%;border-radius:50%;background:var(--k);color:#10121c;display:grid;place-items:center;font-size:3.6cqw;font-weight:800;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.5)}
#bd svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px}
.ctl button{height:48px;border:0;border-radius:16px;background:transparent;font-size:20px}
.ctl button:active{background:rgba(255,255,255,.15)}
.card{--c:163,167,192;border-left:5px solid rgb(var(--c))}
.card p{margin:8px 0 0}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.hd b{font-size:20px;letter-spacing:-.02em}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:rgba(var(--c),.3);border:1px solid rgba(var(--c),.6)}
.kb{color:var(--k);font-weight:700}
.ev{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.35);border-radius:8px;padding:2px 8px}
#gr{width:100%;height:70px;display:block;border-radius:10px;cursor:pointer}
#mv{display:flex;flex-wrap:wrap;gap:6px 5px;max-height:230px;overflow:auto}
#mv em{font-style:normal;color:var(--dim);font-size:13px;padding:0 2px 0 6px;align-self:center}
.ch{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(var(--c),.55);background:linear-gradient(rgba(var(--c),.34),rgba(var(--c),.12));border-radius:12px;padding:6px 9px;font-weight:600}
.ch.on{outline:2px solid #fff}
.dot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--k);color:#10121c;font-size:10px;font-weight:800;flex:none}
.ch .dot{width:18px;height:18px;font-size:9px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.two>div{border-radius:16px;padding:12px;background:linear-gradient(rgba(var(--c),.28),rgba(var(--c),.1));border:1px solid rgba(var(--c),.5)}
.big{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tr{display:grid;grid-template-columns:26px 1fr 56px 56px;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08)}
.tr b{text-align:center}.tr b.me{color:#30d158}.tr b.op{color:#ff6961}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{padding-left:18px;position:relative}
li::before{content:"";position:absolute;left:0;top:.5em;width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#38bdf8)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<header class="g bar"><b class="logo">Разбор партий</b><div class="seg" id="src"></div></header>

<section id="home" class="v">
 <form class="g pad" id="f">
  <input id="u" autocapitalize="off" autocomplete="username" aria-label="Ник">
  <button class="btn">Найти партии</button>
 </form>
 <details class="g pad"><summary>Вставить PGN</summary>
  <textarea id="p" rows="5" placeholder="1. e4 e5 2. Nf3 ..."></textarea>
  <button class="btn" id="pb" type="button">Разобрать партию</button>
 </details>
 <p id="msg" class="dim"></p>
 <div id="list" class="v"></div>
</section>

<section id="an" class="v" hidden>
 <div class="row"><button class="btn sm" id="back">‹ Партии</button><small id="st"></small><button class="btn sm" id="flip" aria-label="Перевернуть доску">⇅</button></div>
 <div id="pg"><i></i></div>
 <div id="top"></div>
 <div class="bw"><div id="bar"><i></i></div><div id="bd"></div></div>
 <div id="bot"></div>
 <nav class="g ctl"><button id="b0" aria-label="В начало">⏮</button><button id="b1" aria-label="Назад">◀</button><button id="b2" aria-label="Вперёд">▶</button><button id="b3" aria-label="В конец">⏭</button></nav>
 <div id="card" class="g pad card"></div>
 <div class="g pad"><svg id="gr" viewBox="0 0 100 30" preserveAspectRatio="none" role="img" aria-label="График оценки партии"></svg></div>
 <div id="mv" class="g pad"></div>
 <div id="sum" class="g pad" hidden></div>
 <div id="tips" class="g pad" hidden></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>
<script>
const $=s=>document.querySelector(s),MATE=1e4,CS='abcdefgh';
const K={brilliant:['Блестящий ход','!!','#26c9c3'],great:['Отличный ход','!','#5b8def'],best:['Лучший ход','★','#81b64c'],excellent:['Очень хороший ход','✓','#96bc4b'],good:['Хороший ход','✓','#8fa876'],book:['Дебютный ход','≡','#a88865'],inacc:['Неточность','?!','#f7c631'],mistake:['Ошибка','?','#ffa459'],miss:['Упущенный шанс','✕','#ff7769'],blunder:['Зевок','??','#fa412d']};
const PG={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟\uFE0E'},PV={p:1,n:3,b:3,r:5,q:9,k:0};
const ENG=['https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js','https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js'];
const DRAW=['agreed','repetition','stalemate','insufficient','50move','timevsinsufficient'];

/* Источники партий. Чтобы добавить Lichess: реализуй games(user) и верни
   [{pgn,w,b,wr,br,rs:{w,b},tc,t}] — остальное приложение менять не нужно. */
const SRC={
 chesscom:{n:'Chess.com',async games(u){
  const j=async x=>{const r=await fetch(x);if(!r.ok)throw 0;return r.json()};
  const a=(await j('https://api.chess.com/pub/player/'+encodeURIComponent(u)+'/games/archives')).archives||[];
  let o=[];
  for(const x of a.slice(-3).reverse()){o.push(...(await j(x)).games.reverse().filter(g=>g.pgn));if(o.length>=20)break}
  return o.slice(0,20).map(g=>({pgn:g.pgn,w:g.white.username,b:g.black.username,wr:g.white.rating,br:g.black.rating,rs:{w:g.white.result,b:g.black.result},tc:g.time_class,t:g.end_time}))}},
 lichess:{n:'Lichess (скоро)',soon:1}
};

let G,W,ply=0,flip=0,run=0,SK='chesscom',games=[],user='';
const wp=c=>1/(1+Math.exp(-.00368208*c));
const fmt=c=>Math.abs(c)>=9000?(c>0?'+':'−')+'M'+Math.round((MATE-Math.abs(c))/10):(c>0?'+':c<0?'−':'')+(Math.abs(c)/100).toFixed(1);
const san=(f,u)=>{try{const m=new Chess(f).move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});return m?m.san:u}catch(e){return u}};
const cap=i=>{const p=G.E[i].l[0].pv[0];return !!p&&!!new Chess(G.fens[i]).get(p.slice(2,4))};
const mat=(f,c)=>{let s=0;new Chess(f).board().forEach(r=>r.forEach(p=>{if(p)s+=(p.color===c?1:-1)*PV[p.type]}));return s};
const msg=t=>{$('#msg').textContent=t};
const show=v=>{$('#home').hidden=v!=='home';$('#an').hidden=v!=='an'};

/* ---------- движок ---------- */
function startEngine(i=0){return new Promise((ok,no)=>{
 if(i>=ENG.length)return no();
 const nx=()=>startEngine(i+1).then(ok,no);let w;
 try{w=new Worker(URL.createObjectURL(new Blob(['importScripts("'+ENG[i]+'")'],{type:'text/javascript'})))}catch(e){return nx()}
 const t=setTimeout(()=>{w.terminate();nx()},12000);
 w.onerror=()=>{clearTimeout(t);w.terminate();nx()};
 w.onmessage=e=>{if(String(e.data).includes('uciok')){clearTimeout(t);w.onerror=null;ok(w)}};
 w.postMessage('uci')})}

function ev(i){
 const fen=G.fens[i],s=fen.split(' ')[1]==='w'?1:-1,c=new Chess(fen);
 if(c.game_over())return Promise.resolve({l:[{cp:c.in_checkmate()?-s*MATE:0,pv:[]}]});
 return new Promise(ok=>{const L=[];
  W.onmessage=e=>{const t=String(e.data);
   if(t.startsWith('info')&&t.includes(' pv ')){const sc=/score (cp|mate) (-?\d+)/.exec(t);if(!sc)return;
    const n=+((/multipv (\d+)/.exec(t)||[0,1])[1]),v=+sc[2];
    L[n-1]={cp:s*(sc[1]==='cp'?v:(v>0?1:-1)*(MATE-Math.abs(v)*10)),pv:t.split(' pv ')[1].trim().split(' ')}}
   else if(t.startsWith('bestmove')){const l=L.filter(Boolean);ok({l:l.length?l:[{cp:0,pv:[]}]})}};
  W.postMessage('position fen '+fen);W.postMessage('go depth 12 movetime 700')})}

/* ---------- оценка ходов ---------- */
function sac(i){const m=G.mv[i-1],pv=G.E[i].l[0].pv;if(PV[m.piece]<3||!pv[0])return 0;
 const c=new Chess(G.fens[i]),mv=u=>u&&c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});
 if(!mv(pv[0]))return 0;mv(pv[1]);return mat(G.fens[i-1],m.color)-mat(c.fen(),m.color)>=2}

function grade(i){const m=G.mv[i-1],a=G.E[i-1].l,b=G.E[i].l,s=m.color==='w'?1:-1,wb=wp(s*a[0].cp),wa=wp(s*b[0].cp),
 best=a[0].pv[0]===m.from+m.to+(m.promotion||''),L=best?0:Math.max(0,wb-wa),pl=i>1?G.ls[i-1]:0;
 let k=best?'best':L<=.02?'excellent':L<=.05?'good':L<=.1?'inacc':L<=.2?'mistake':'blunder';
 if(i<=10&&L<=.03)k='book';
 else if(L<=.02&&a[1]&&wb-wp(s*a[1].cp)>=.12&&wb<.95)k='great';
 if(L<=.02&&wa>=.45&&wb<.9&&sac(i))k='brilliant';
 if(pl>=.1&&L>=.05&&L<.2)k='miss';
 G.ls[i]=L;G.k[i]=k;G.ac[i]=Math.min(100,Math.max(0,103.1668*Math.exp(-4.354*(wb-wa))-3.1669))}

function say(i){const m=G.mv[i-1],k=G.k[i],a=G.E[i-1].l,b=G.E[i].l,w=m.color===G.me?'Ты':'Соперник',
 bs=a[0].pv[0]?san(G.fens[i-1],a[0].pv[0]):'',rp=b[0].pv[0]?san(G.fens[i],b[0].pv[0]):'',
 why=cap(i)?' После '+rp+' теряется материал.':Math.abs(b[0].cp)>=9000?' Дальше следует форсированный мат.':' Оценка изменилась с '+fmt(a[0].cp)+' на '+fmt(b[0].cp)+'.';
 return({brilliant:w+' пожертвовал материалом ради сильной позиции — такой ход трудно заметить.',great:w+' нашёл единственный сильный ход: остальные продолжения заметно слабее.',best:'Это первый выбор движка. Лучше сыграть было нельзя.',excellent:'Почти идеально: '+bs+' был лишь чуть точнее.',good:'Нормальный ход, но '+bs+' был точнее.',book:'Знакомая дебютная стадия: оценка позиции не изменилась.',inacc:'Неточность: '+bs+' был лучше.'+why,mistake:'Ошибка: '+bs+' сохранял позицию.'+why,miss:w+' упустил шанс: '+bs+' давал заметное преимущество.'+why,blunder:'Серьёзный просчёт: '+bs+' был намного лучше.'+why})[k]}

function tips(){const me=G.me,s=me==='w'?1:-1,my=[];
 G.mv.forEach((m,j)=>{if(m.color===me)my.push({i:j+1,k:G.k[j+1]})});
 const bad=x=>/^(mistake|blunder|miss)$/.test(x.k),n=k=>my.filter(x=>x.k===k).length;
 const ph=[[1,20,'дебюте','Повтори принципы: развивай фигуры, борись за центр, вовремя рокируйся. Выбери по одному дебюту за каждый цвет и выучи первые 8–10 ходов.'],[21,60,'миттельшпиле','Перед каждым ходом проверяй шахи, взятия и угрозы соперника — так находят тактику и не пропускают её.'],[61,999,'эндшпиле','Потренируй базовые окончания: король и пешка, ладейные эндшпили, правило квадрата. Здесь один неточный ход решает партию.']].map(a=>[my.filter(x=>x.i>=a[0]&&x.i<=a[1]&&bad(x)).length,a]).sort((x,y)=>y[0]-x[0]);
 const t=[],bl=n('blunder'),hang=my.filter(x=>x.k==='blunder'&&cap(x.i)).length,ms=n('miss'),top=n('brilliant')+n('great');
 let best=0;G.E.forEach(e=>{best=Math.max(best,wp(s*e.l[0].cp))});
 const won=G.res==='1-0'&&me==='w'||G.res==='0-1'&&me==='b';
 if(hang)t.push('В '+hang+' из зевков соперник просто забирал материал. Перед ходом спрашивай себя: что этот ход оставляет без защиты и что теперь может взять соперник?');
 else if(bl)t.push('Зевков: '+bl+'. Прежде чем отпустить фигуру, проверь, на что нападает соперник после твоего хода.');
 if(ph[0][0])t.push('Больше всего потерь в '+ph[0][1][2]+' ('+ph[0][0]+'). '+ph[0][1][3]);
 if(ms)t.push('Упущено шансов: '+ms+'. Когда соперник ошибся, сначала проверь все шахи и взятия — выигрывающий удар часто именно там.');
 if(best>=.8&&!won)t.push('У тебя была выигрышная позиция, но партия не выиграна. Имея перевес, меняй фигуры, не усложняй и перед каждым ходом проверяй, нет ли у соперника контрудара.');
 if(top)t.push('Сильных ходов: '+top+'. Это твоя сильная сторона — продолжай искать тактические идеи.');
 if(!t.length)t.push('Партия сыграна без серьёзных ошибок. Чтобы расти дальше, играй с более сильными соперниками и разбирай каждую партию.');
 return t.slice(0,4)}

async function analyze(){
 const id=++run,n=G.fens.length;$('#st').textContent='Загрузка движка…';
 try{if(W)W.terminate();W=await startEngine();W.postMessage('setoption name MultiPV value 2')}
 catch(e){$('#st').textContent='Движок не загрузился: нужен интернет';return}
 if(id!==run){W.terminate();return}
 for(let i=0;i<n;i++){G.E[i]=await ev(i);if(id!==run)return;if(i)grade(i);
  $('#st').textContent='Анализ '+i+'/'+(n-1);$('#pg i').style.width=100*i/(n-1||1)+'%';render()}
 const S={w:{},b:{}},A={w:[],b:[]};
 G.mv.forEach((m,j)=>{const k=G.k[j+1];S[m.color][k]=(S[m.color][k]||0)+1;A[m.color].push(G.ac[j+1])});
 const acc=x=>x.length?Math.round(x.reduce((p,c)=>p+c,0)/x.length):0;
 G.S=S;G.A={w:acc(A.w),b:acc(A.b)};G.done=1;$('#st').textContent='Анализ готов';W.terminate();render()}

/* ---------- интерфейс ---------- */
function graph(){const n=G.fens.length-1,E=G.E;if(n<1||!E.length)return;
 const p=E.map((e,i)=>(i/n*100).toFixed(1)+','+(30*(1-wp(e.l[0].cp))).toFixed(1)),x=ply/n*100;
 $('#gr').innerHTML='<rect width="100" height="30" fill="rgba(0,0,0,.3)"/><path d="M0,30L'+p.join('L')+'L'+((E.length-1)/n*100).toFixed(1)+',30Z" fill="rgba(255,255,255,.85)"/><line x1="0" x2="100" y1="15" y2="15" stroke="rgba(120,120,160,.7)" stroke-width="1" vector-effect="non-scaling-stroke"/><line x1="'+x+'" x2="'+x+'" y1="0" y2="30" stroke="#ff9f0a" stroke-width="2" vector-effect="non-scaling-stroke"/>'}

function render(){if(!G)return;
 const g=G,m=ply?g.mv[ply-1]:0,k=g.k[ply],own=m?(m.color===g.me?'me':'op'):'',E=g.E[ply],b=new Chess(g.fens[ply]).board();
 [['#top',flip?'w':'b'],['#bot',flip?'b':'w']].forEach(([q,c])=>{const e=$(q);e.className='pl '+(c===g.me?'me':'op');e.dataset.c=c;
  e.innerHTML='<b>'+(c==='w'?g.w:g.b)+'</b><small>'+((c==='w'?g.wr:g.br)||'')+'</small><span>'+(c===g.me?'Ты':'Соперник')+'</span>'});
 const bm=m&&k&&/^(good|inacc|mistake|miss|blunder)$/.test(k)&&g.E[ply-1].l[0].pv[0];
 let h='';
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const R=flip?7-r:r,C=flip?7-c:c,p=b[R][C],q=CS[C]+(8-R),hl=m&&(q===m.from||q===m.to);
  h+='<i class="s '+((R+C)%2?'d':'l')+(hl?' h '+own:'')+'"'+(r===7?' data-f="'+CS[C]+'"':'')+'>'+(c===0?'<s>'+(8-R)+'</s>':'')+(p?'<u class="'+p.color+'">'+PG[p.type]+'</u>':'')+(m&&k&&q===m.to?'<b class="bg" style="--k:'+K[k][2]+'">'+K[k][1]+'</b>':'')+'</i>'}
 if(bm){const P=u=>{const c=CS.indexOf(u[0]),r=8-u[1];return[(flip?7-c:c)+.5,(flip?7-r:r)+.5]},[x1,y1]=P(bm),[x2,y2]=P(bm.slice(2));
  h+='<svg viewBox="0 0 8 8"><defs><marker id="ah" markerWidth="3" markerHeight="3" refX="1.4" refY="1.5" orient="auto"><path d="M0 0L3 1.5L0 3z" fill="#81b64c"/></marker></defs><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#81b64c" stroke-width=".22" stroke-linecap="round" opacity=".9" marker-end="url(#ah)"/></svg>'}
 $('#bd').innerHTML=h;
 $('#bar i').style.height=(E?100*wp(E.l[0].cp):50)+'%';$('#bar').style.transform=flip?'rotate(180deg)':'';
 let c;const tg='<span class="tag '+own+'">'+(own==='me'?'Ты':'Соперник')+'</span>';
 if(!m)c='<div class="hd"><b>Начальная позиция</b>'+(E?'<span class="ev">'+fmt(E.l[0].cp)+'</span>':'')+'</div><p class="dim">Листай ходы кнопками или нажми на любой ход ниже. Нажми на имя игрока, чтобы отметить, кто из вас ты.</p>';
 else if(!k)c='<div class="hd"><b>'+m.san+'</b>'+tg+'</div><p class="dim">Ход ещё анализируется…</p>';
 else c='<div class="hd"><b>'+m.san+'</b>'+tg+'<span class="kb" style="--k:'+K[k][2]+'">'+K[k][1]+' '+K[k][0]+'</span><span class="ev">'+fmt(E.l[0].cp)+'</span></div><p>'+say(ply)+'</p>'+(bm?'<p class="dim">Лучший ход: <b>'+san(g.fens[ply-1],bm)+'</b></p>':'');
 $('#card').className='g pad card '+own;$('#card').innerHTML=c;
 let ml='';
 g.mv.forEach((x,j)=>{const i=j+1,kk=g.k[i];if(x.color==='w')ml+='<em>'+Math.ceil(i/2)+'.</em>';
  ml+='<button class="ch '+(x.color===g.me?'me':'op')+(i===ply?' on':'')+'" data-i="'+i+'">'+(kk?'<span class="dot" style="--k:'+K[kk][2]+'">'+K[kk][1]+'</span>':'')+x.san+'</button>'});
 const mv=$('#mv'),st=mv.scrollTop;mv.innerHTML=ml;mv.scrollTop=st;
 if(g.done){const me=g.me,op=me==='w'?'b':'w',col=c=>'<div class="'+(c===me?'me':'op')+'"><b>'+(c===me?'Ты':'Соперник')+'</b><br><small>'+(c==='w'?g.w:g.b)+'</small><div class="big">'+g.A[c]+'<small>%</small></div><small>точность</small></div>';
  $('#sum').hidden=0;
  $('#sum').innerHTML='<h2>Итоги партии</h2><div class="two">'+col(me)+col(op)+'</div><div class="tr"><span></span><span></span><b class="me">Ты</b><b class="op">Соп.</b></div>'+Object.keys(K).map(k=>'<div class="tr"><span class="dot" style="--k:'+K[k][2]+'">'+K[k][1]+'</span><span>'+K[k][0]+'</span><b class="me">'+(g.S[me][k]||0)+'</b><b class="op">'+(g.S[op][k]||0)+'</b></div>').join('');
  $('#tips').hidden=0;$('#tips').innerHTML='<h2>Советы на следующие партии</h2><ul>'+tips().map(t=>'<li>'+t+'</li>').join('')+'</ul>'}
 graph()}

function go(i){ply=Math.max(0,Math.min(G.fens.length-1,i));render();
 const a=$('#mv .on'),c=$('#mv');if(a&&(a.offsetTop<c.scrollTop||a.offsetTop+a.offsetHeight>c.scrollTop+c.clientHeight))c.scrollTop=a.offsetTop-c.clientHeight/2}

function openGame(g,me){
 const c=new Chess();if(!c.load_pgn(g.pgn,{sloppy:true})){msg('Не удалось разобрать PGN');return}
 const h=c.header(),mv=c.history({verbose:true}),r=new Chess(),fens=[r.fen()];
 mv.forEach(m=>{r.move(m.san,{sloppy:true});fens.push(r.fen())});
 const lw=(h.White||'').toLowerCase(),lb=(h.Black||'').toLowerCase();
 G={w:g.w||h.White||'Белые',b:g.b||h.Black||'Чёрные',wr:g.wr||h.WhiteElo,br:g.br||h.BlackElo,res:h.Result,me:me||(user&&lb===user&&lw!==user?'b':'w'),mv,fens,E:[],k:[],ac:[],ls:[]};
 ply=0;flip=G.me==='b';$('#sum').hidden=$('#tips').hidden=true;$('#pg i').style.width='0';
 show('an');render();analyze()}

function list(){const o=[];
 $('#list').innerHTML=games.map((g,i)=>{const me=g.w.toLowerCase()===user?'w':'b',r=g.rs[me],p=me==='w'?[g.b,g.br]:[g.w,g.wr],
  res=r==='win'?['Победа','#30d158']:DRAW.includes(r)?['Ничья','#a3a7c0']:['Поражение','#ff453a'];
  return '<button class="g gm" data-i="'+i+'"><i class="rd" style="background:'+res[1]+'"></i><span><b>'+p[0]+'</b> <small>'+(p[1]||'')+'</small><br><small>'+res[0]+'</small> <small>'+g.tc+'</small> <small>'+new Date(g.t*1e3).toLocaleDateString('ru')+'</small></span></button>'}).join('')}

function srcUI(){$('#src').innerHTML=Object.entries(SRC).map(([k,s])=>'<button data-k="'+k+'" class="'+(k===SK?'on':'')+'"'+(s.soon?' disabled':'')+'>'+s.n+'</button>').join('');$('#u').placeholder='Ник на '+SRC[SK].n}
srcUI();
try{$('#u').value=localStorage.cu||''}catch(e){}

$('#f').onsubmit=async e=>{e.preventDefault();const u=$('#u').value.trim().toLowerCase();if(!u)return;user=u;
 try{localStorage.cu=u}catch(x){}
 msg('Загружаю партии…');$('#list').innerHTML='';
 try{games=await SRC[SK].games(u);msg(games.length?'':'Партий не найдено');list()}
 catch(x){msg('Не получилось загрузить. Проверь ник и интернет или вставь PGN ниже.')}};
$('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b){const g=games[+b.dataset.i];openGame(g,g.w.toLowerCase()===user?'w':'b')}};
$('#pb').onclick=()=>{const p=$('#p').value.trim();if(p)openGame({pgn:p})};
$('#mv').onclick=e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)};
['#top','#bot'].forEach(q=>$(q).onclick=()=>{G.me=$(q).dataset.c;render()});
$('#back').onclick=()=>{run++;if(W)W.terminate();show('home')};
$('#flip').onclick=()=>{flip=!flip;render()};
$('#b0').onclick=()=>go(0);$('#b1').onclick=()=>go(ply-1);$('#b2').onclick=()=>go(ply+1);$('#b3').onclick=()=>go(1e3);
$('#gr').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(Math.round((e.clientX-r.left)/r.width*(G.fens.length-1)))};
onkeydown=e=>{if($('#an').hidden)return;if(e.key==='ArrowLeft')go(ply-1);if(e.key==='ArrowRight')go(ply+1)};
</script>
</body>
