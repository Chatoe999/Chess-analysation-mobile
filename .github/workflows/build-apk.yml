name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessAnalysis-Android-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Unpack Android project
        run: |
          test -f ChessAnalysis-Android-project.zip
          mkdir -p android-project
          unzip -q ChessAnalysis-Android-project.zip -d android-project
          test -f android-project/ChessAnalysis-Android-project/settings.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '15859902'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android-project/ChessAnalysis-Android-project --no-daemon assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-analysis-apk
          path: android-project/ChessAnalysis-Android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to the latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android APK
          body: |
            Последняя автоматически собранная версия Chess Analysis Mobile для Android.
            Скачайте файл ChessAnalysis.apk в разделе Assets.
          files: android-project/ChessAnalysis-Android-project/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
